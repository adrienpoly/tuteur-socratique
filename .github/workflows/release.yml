# Publie un .zip par skill à chaque tag vX.Y.Z, pour l'import dans l'app Claude.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le .zip doit contenir le dossier de la skill lui-même, pas seulement son
      # contenu : c'est ce que l'import de Claude attend.
      - name: Compresser les skills
        run: |
          for skill in tuteur-socratique tuteur-socratique-adulte; do
            zip -r "$skill.zip" "$skill" -x "*.DS_Store"
          done

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            tuteur-socratique.zip tuteur-socratique-adulte.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
